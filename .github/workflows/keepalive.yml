name: Keep backend awake

# Manual only: GitHub ran a */10 schedule roughly 5 times a day, which is useless
# against Render's 15-minute sleep. An external cron service does the real pinging.
on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 120 -w '%{http_code}' https://bitpulse-lel3.onrender.com/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Backend is awake (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code"
            sleep 20
          done
          echo "::error::Backend did not return 200 after 3 attempts."
          exit 1

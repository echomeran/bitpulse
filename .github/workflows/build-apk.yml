name: Build BitPulse Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 requests==2.32.5

      - name: Build Android APK
        run: |
          flet build apk src \
            --output build/apk \
            --project bitpulse \
            --product BitPulse \
            --org com.bitpulse \
            --bundle-id com.bitpulse.app \
            --description "Bitcoin news, market data and AI education." \
            --build-version 1.0.0 \
            --build-number 1 \
            --arch arm64-v8a \
            --android-permissions android.permission.INTERNET=True android.permission.ACCESS_NETWORK_STATE=True

      - name: Rename APK for release
        run: |
          mkdir -p dist
          find build/apk -name "*.apk" -exec cp {} dist/BitPulse-v1.0.0.apk \;
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitPulse-v1.0.0-apk
          path: dist/BitPulse-v1.0.0.apk
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BitPulse-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

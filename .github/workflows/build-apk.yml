name: Build BitPulse Android APK and AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KS"
            echo "Keystore: $(stat -c%s "$KS") bytes, sha256 $(sha256sum "$KS" | cut -d' ' -f1)"
            if ! keytool -list -keystore "$KS" -storepass:env KEYSTORE_PASSWORD > /dev/null; then
              echo "::error::The keystore cannot be opened with ANDROID_KEYSTORE_PASSWORD. Check that secret, and that ANDROID_KEYSTORE_BASE64 was pasted in full."
              exit 1
            fi
            if ! keytool -certreq -alias "${KEY_ALIAS:-upload}" -keystore "$KS" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD > /dev/null; then
              echo "::error::The key cannot be unlocked. Check ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
              exit 1
            fi
            echo "keystore=$KS" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will be signed with a debug key."
          fi

      # The APK is for direct installs (GitHub Release); the AAB is what Google Play accepts.
      # Both are signed with the same key, which Play treats as the upload key.
      - name: Build Android APK and App Bundle
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SIGNING_ARGS=()
          if [ -n "$KEYSTORE" ]; then
            SIGNING_ARGS=(--android-signing-key-store "$KEYSTORE" --android-signing-key-alias "${KEY_ALIAS:-upload}")
          fi
          for TARGET in apk aab; do
            flet build "$TARGET" src \
              --output "build/$TARGET" \
              --project bitpulse \
              --product BitPulse \
              --org io.github.echomeran \
              --bundle-id io.github.echomeran.bitpulse \
              --description "Bitcoin news, market data and AI education." \
              --build-version "${{ steps.version.outputs.version }}" \
              --build-number "${{ steps.version.outputs.build_number }}" \
              --arch arm64-v8a \
              --android-permissions android.permission.INTERNET=True android.permission.ACCESS_NETWORK_STATE=True \
              "${SIGNING_ARGS[@]}"
          done

      - name: Collect APK and AAB
        run: |
          mkdir -p dist
          APK=$(find build/apk -name "*.apk" | head -n 1)
          AAB=$(find build/aab -name "*.aab" | head -n 1)
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" "dist/BitPulse-v${{ steps.version.outputs.version }}.apk"
          cp "$AAB" "dist/BitPulse-v${{ steps.version.outputs.version }}.aab"
          ls -la dist/

      - name: Check target SDK
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          BADGING=$("$AAPT2" dump badging dist/*.apk)
          echo "$BADGING" | grep -E "^(package|sdkVersion|targetSdkVersion)"
          TARGET_SDK=$(echo "$BADGING" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          if [ "${TARGET_SDK:-0}" -lt 36 ]; then
            echo "::error::targetSdkVersion is ${TARGET_SDK:-unknown}; Google Play requires 36. See src/pyproject.toml."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BitPulse-v${{ steps.version.outputs.version }}-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab

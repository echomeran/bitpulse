[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["services", "views", "sources", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "server"]
